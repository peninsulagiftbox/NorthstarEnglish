openapi: 3.1.0
info:
  title: Northstar English Local API
  version: 0.5.0
  description: Phase 05 adds contextual vocabulary, favorites, reading attempts and evidence-linked review sources. Source/voice rights pending review; formal publication blocked.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Query actual MySQL project identity, settings and migration version
      responses:
        '200':
          description: Database available and project identity valid; Cache-Control no-store
          headers:
            X-Northstar-Test-Database: {schema: {type: string, enum: ["true", "false"]}, description: True only when SELECT DATABASE() matches the isolated test schema; write E2E requires true}
          content:
            application/json:
              schema:
                type: object
                required: [status, database, project, migrationVersion, checkedAt]
                properties:
                  status: {type: string, const: UP}
                  database: {type: string, const: UP}
                  project: {type: string, const: northstar-english-local-v1}
                  migrationVersion: {type: string}
                  checkedAt: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '503':
          description: MySQL unavailable or identity invalid; never a simulated UP
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Actual feature boundaries for this phase
          content:
            application/json:
              schema:
                type: object
                required: [phase, contentApiAvailable, learningContentAvailable, aiEnabled, asrEnabled, pronunciationScoringEnabled]
                properties:
                  phase: {type: string, const: '05'}
                  contentApiAvailable: {type: boolean, const: true}
                  learningContentAvailable: {type: boolean, const: true}
                  aiEnabled: {type: boolean, const: false}
                  asrEnabled: {type: boolean, const: false}
                  pronunciationScoringEnabled: {type: boolean, const: false}
        '403': {$ref: '#/components/responses/LocalOnly'}
  /settings:
    get:
      operationId: getLocalSettings
      description: Read-only preferences. Editing and optimistic concurrency are introduced in Phase 08.
      responses:
        '200':
          description: Persisted local preferences, no credentials
          content:
            application/json:
              schema:
                type: object
                required: [timezone, defaultSpeed, showTranslation, showHints, shortcutEnabled, recordingRetention, rowVersion]
                properties:
                  timezone: {type: string, example: Asia/Shanghai}
                  defaultSpeed: {type: number, enum: [0.75, 1, 1.25, 1.5]}
                  showTranslation: {type: boolean}
                  showHints: {type: boolean}
                  shortcutEnabled: {type: boolean}
                  recordingRetention: {type: string, const: manual}
                  rowVersion: {type: integer, minimum: 0}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /books:
    get:
      operationId: getBooks
      description: Four catalog-only book metadata records, with a separate original demo. No textbook lesson bodies or recordings.
      responses:
        '200':
          description: Catalog metadata; no-store
          content:
            application/json:
              schema:
                type: object
                required: [books, standaloneLessons]
                properties:
                  books:
                    type: array
                    items: {$ref: '#/components/schemas/Book'}
                  standaloneLessons:
                    type: array
                    items: {$ref: '#/components/schemas/LessonSummary'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /lessons:
    get:
      operationId: listAvailableLessons
      responses:
        '200':
          description: Original demo only; catalog-only books do not have fake lessons
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LessonSummary'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /lessons/{id}:
    get:
      operationId: getLesson
      parameters:
        - {name: versionId, in: query, required: false, schema: {type: string}, example: demo-01-v2}
        - {name: id, in: path, required: true, schema: {type: string}, example: demo-01}
      description: One request returns ten original sentences, translations, preset explanations, vocabulary, exercise definitions and audio URIs. Answer keys and quiz explanations remain server-side. Audio integrity is checked before returning success.
      description: Returns the current default version, or an explicit immutable published version. Old-version learning records remain bound to that version.
      responses:
        '200':
          description: Frozen versioned local-test content; releaseReady=false
          content:
            application/json:
              schema:
                type: object
                required: [id, versionId, version, title, bookId, kind, availability, sentences, vocabulary, exercises, licenses, releaseReady, usageScope, explanationLabel]
                properties:
                  id: {type: string, const: demo-01}
                  versionId: {type: string, const: demo-01-v1}
                  version: {type: integer, const: 1}
                  title: {type: string}
                  bookId: {type: 'null'}
                  kind: {type: string, const: original_demo}
                  availability: {type: string, const: available}
                  usageScope: {type: string, const: local_test_only}
                  releaseReady: {type: boolean, const: false}
                  explanationLabel: {type: string, const: 本地预置讲解}
                  sentences:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items: {$ref: '#/components/schemas/Sentence'}
                  vocabulary:
                    type: array
                    items:
                      type: object
                      required: [id, term, meaning, example, sentenceIds]
                      properties:
                        id: {type: string}
                        term: {type: string}
                        meaning: {type: string}
                        example: {type: string}
                        sentenceIds: {type: array, items: {type: string}}
                  exercises:
                    type: array
                    items:
                      type: object
                      required: [id, kind, prompt, sentenceIds]
                      properties:
                        id: {type: string}
                        kind: {type: string, enum: [dictation, reading_choice, writing_prompt, quiz_choice]}
                        prompt: {type: string}
                        sentenceIds: {type: array, items: {type: string}}
                        options:
                          type: array
                          items:
                            type: object
                            required: [id, text]
                            properties:
                              id: {type: string}
                              text: {type: string}
                        targetExpressions: {type: array, items: {type: string}}
                  licenses:
                    type: array
                    items: {$ref: '#/components/schemas/ContentLicense'}
        '404': {$ref: '#/components/responses/ContentNotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /licenses/{id}:
    get:
      operationId: getContentLicense
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: demo-audio-v1}
      responses:
        '200':
          description: Declared provenance and review status; unknown fields never imply confirmed rights
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentLicense'}
        '404': {$ref: '#/components/responses/ContentNotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /audio/{id}:
    get:
      operationId: getSentenceAudio
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: demo-01-v1-a01}
        - {name: Range, in: header, required: false, schema: {type: string}, example: 'bytes=0-31'}
      description: Reads only a database-resolved, root-contained file with matching size and SHA-256. Never accepts filesystem paths. Sentence-local MP3; no whole-lesson time alignment.
      responses:
        '200':
          description: Full MP3; Accept-Ranges bytes and Cache-Control no-store
          content:
            audio/mpeg:
              schema: {type: string, format: binary}
        '206':
          description: Requested MP3 byte range; Content-Range bytes start-end/size
          content:
            audio/mpeg:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/ContentNotFound'}
        '416':
          description: Malformed or unsatisfiable byte range; Content-Range bytes */size. Spring Resource response may have an empty body.
        '503': {$ref: '#/components/responses/Unavailable'}
  /study/resume:
    get:
      operationId: getBrowsingCheckpoint
      summary: Read the local browsing checkpoint; never exercise evidence
      responses:
        '200':
          description: Persisted checkpoint with ETag equal to quoted rowVersion; Cache-Control no-store
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Checkpoint'}
                  - type: object
                    required: [sessionId, rowVersion]
                    properties:
                      sessionId: {type: string, format: uuid}
                      rowVersion: {type: integer, minimum: 1}
        '204': {description: No checkpoint has been saved}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '503': {description: Local database unavailable}
    put: &saveCheckpoint
      operationId: saveBrowsingCheckpoint
      description: Requires allowed loopback Origin, application/json and X-Northstar-Request local-workspace. If-Match is the quoted prior revision, initially "0". Atomic revision check rejects other-page conflicts. Optional playingSentenceId and sentence-local positionMs restore paused. No training evidence or drafts are stored here.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string, pattern: '^"[0-9]{1,16}"$'}
        - in: header
          name: X-Northstar-Request
          required: true
          schema: {type: string, const: local-workspace}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Checkpoint'}
      responses:
        '200':
          description: Checkpoint saved; new revision and matching ETag. Response body only contains rowVersion.
          content:
            application/json:
              schema:
                type: object
                required: [rowVersion]
                properties:
                  rowVersion: {type: integer, minimum: 1}
        '400': {description: Invalid tab, boolean, revision or request body; Problem JSON}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '404': {description: Unavailable lesson, unknown version or foreign sentence; Problem JSON}
        '412': {description: Another page has changed the checkpoint; preserve local draft and reload; Problem JSON}
        '428': {description: If-Match missing; Problem JSON}
        '503': {description: Local database or checkpoint write grant unavailable; Problem JSON}
  /study/sessions:
    post:
      <<: *saveCheckpoint
      operationId: openBrowsingSession
      summary: Initialize or update the singleton local browsing session with the same revision rules
  /drafts/{sentence}:
    parameters:
      - {name: sentence, in: path, required: true, schema: {type: string}}
    get:
      operationId: getDictationDraft
      parameters:
        - {name: lessonId, in: query, required: true, schema: {type: string}}
        - {name: versionId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Text plus rowVersion; empty draft returns text empty and rowVersion 0
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DraftSnapshot'}
        '422': {description: Target does not belong to the available lesson/version}
    put:
      operationId: saveDictationDraft
      description: Local Origin, JSON and X-Northstar-Request local-workspace required. If-Match uses quoted prior revision, initially "0". Conflict never overwrites the server draft.
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lessonId, versionId, text]
              properties:
                lessonId: {type: string, maxLength: 64}
                versionId: {type: string, maxLength: 64}
                text: {type: string, maxLength: 10000}
      responses:
        '200': {description: Saved; body contains new rowVersion}
        '400': {description: Invalid payload or quoted revision}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '412': {description: DRAFT_VERSION_CONFLICT; retain local and server copies for explicit resolution}
        '422': {description: Invalid lesson/version/sentence binding}
        '428': {description: If-Match is required}
        '503': {$ref: '#/components/responses/Unavailable'}
  /exercises/{id}/attempts:
    post:
      operationId: submitDictation
      description: Exercise id is sentenceId-dictation. All writes require local Origin, JSON and X-Northstar-Request local-workspace. UUID is persisted in IndexedDB before sending. Same operation and payload replay the original response; different payload with same UUID returns 409. Receipt, attempt, evidence, stage and optional review source commit atomically. audioPlayed is a browser playback observation, not a professional or server-side listening assessment. Server independently verifies source readiness, size and SHA-256.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/LearningCommand'}
                - type: object
                  required: [text, audioPlayed, answerExposed]
                  properties:
                    text: {type: string, maxLength: 10000}
                    audioPlayed: {type: boolean}
                    answerExposed: {type: boolean}
      responses:
        '200':
          description: A real attempt, including incorrect submissions, is practiced; original input and aligned token edits returned
          content:
            application/json:
              schema:
                type: object
                required: [attemptId, eventId, evidenceId, state, rawText, standardText, result, answerExposed, reviewItemId]
                properties:
                  attemptId: {type: string, format: uuid}
                  eventId: {type: string, format: uuid}
                  evidenceId: {type: string, format: uuid}
                  state: {type: string, const: practiced}
                  rawText: {type: string}
                  standardText: {type: string}
                  answerExposed: {type: boolean}
                  reviewItemId: {type: string, description: Empty if correct; stable per sentence otherwise}
                  result: {$ref: '#/components/schemas/TokenResult'}
        '400': {description: Invalid UUID, timestamp or payload}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '409': {description: IDEMPOTENCY_CONFLICT; same eventId cannot change operation or payload}
        '422': {description: EMPTY_ANSWER, AUDIO_NOT_PLAYED or CONTEXT_MISMATCH; no evidence persisted}
        '503': {$ref: '#/components/responses/Unavailable'}
  /study/events:
    post:
      operationId: recordStudyAction
      description: Same local write headers and UUID replay contract as attempts. Only start/skip/pause accepted. Never creates an attempt, evidence or increments practiceCount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/LearningCommand'}
                - type: object
                  required: [action]
                  properties:
                    action: {type: string, enum: [start, skip, pause]}
      responses:
        '200': {description: eventId and state in_progress/skipped/paused; historical evidence retained}
        '400': {description: Invalid payload, UUID or timestamp}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '409': {description: IDEMPOTENCY_CONFLICT}
        '422': {description: Invalid action or context; practiced/correct cannot be reported directly}
        '503': {$ref: '#/components/responses/Unavailable'}
  /study/stages:
    get:
      operationId: getDictationStages
      parameters:
        - {name: lessonId, in: query, required: true, schema: {type: string}}
        - {name: versionId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: One item per sentence; current round state and historical attempt count are separate
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sentenceId: {type: string}
                    state: {type: string, enum: [not_started, in_progress, practiced, skipped, paused]}
                    practiceCount: {type: integer, minimum: 0}
  /reviews/items:
    get:
      operationId: getReviewSources
      description: One row per incorrect attempt source, grouped by stable item id in UI. Reading and dictation share sentence cards and retain distinct error sources. No scheduling or mastery score.
      responses:
        '200':
          description: All pending sources; empty array when there are no errors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    status: {type: string, const: pending}
                    attemptId: {type: string, format: uuid}
                    lessonId: {type: string}
                    versionId: {type: string}
                    sentenceId: {type: string}
                    exerciseId: {type: string}
                    sequence: {type: integer}
                    rawText: {type: string}
                    standardText: {type: string}
                    reason: {type: string, enum: [dictation_token_difference, reading_evidence_mismatch]}
                    kind: {type: string, enum: [dictation, reading_choice]}
                    knowledgePointId: {type: [string, "null"]}
                    optionId: {type: [string, "null"]}
                    recordedAt: {type: string, description: UTC server time}
        '503': {$ref: '#/components/responses/Unavailable'}
  /reading:
    get:
      operationId: getReading
      description: Read versioned vocabulary and reading questions with saved favorites and immutable history. Answer keys are omitted; previous submitted feedback remains in history. Does not create practice evidence.
      parameters:
        - {name: lessonId, in: query, required: true, schema: {type: string}}
        - {name: versionId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: vocabulary entries (id, sentenceId, sequence, sourceText, term, meaning, usageNote, example, favorite boolean), questions (stable id, prompt, options, knowledgePointId, sentenceId, current state, history). History rows contain attemptId, eventId, optionId, correct, resultJson and recordedAt.
        '422': {description: CONTEXT_MISMATCH - lesson/version mismatch}
  /knowledge/{id}/favorite:
    put:
      operationId: saveVocabularyFavorite
      description: Set desired favorite state; repeated identical PUTs are safe. Does not imply mastery, practice or error review. Same-origin write headers required.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lessonId, versionId, favorite]
              properties:
                lessonId: {type: string}
                versionId: {type: string}
                favorite: {type: boolean}
      responses:
        '200': {description: Persisted favorite boolean}
        '422': {description: CONTEXT_MISMATCH - word does not belong to this lesson/version}
  /reading/{id}/attempts:
    post:
      operationId: submitReadingAttempt
      description: Grade server-side by stable option ID. Transactionally save attempt, option, immutable result, evidence and practiced state; incorrect answers append knowledge-linked review sources. Same eventId/payload replays receipt; changed payload conflicts. Same-origin write headers required.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, lessonId, versionId, optionId, clientOccurredAt]
              properties:
                eventId: {type: string, format: uuid}
                lessonId: {type: string}
                versionId: {type: string}
                optionId: {type: string}
                clientOccurredAt: {type: string, format: date-time}
      responses:
        '200': {description: Receipt with attemptId, eventId, evidenceId, state practiced and result (correct, correctOptionId, correctText, sentenceId, knowledgePointId, standardText, explanation, algorithmVersion)}
        '409': {description: IDEMPOTENCY_CONFLICT - event reused with another payload}
        '422': {description: CONTEXT_MISMATCH or INVALID_OPTION - no receipt/attempt committed}
  /reading/{id}/events:
    post:
      operationId: changeReadingRound
      description: Idempotent start/pause/skip changes current round only; immutable attempt history is retained. No practice evidence is created. Same-origin write headers required.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, lessonId, versionId, action, clientOccurredAt]
              properties:
                eventId: {type: string, format: uuid}
                lessonId: {type: string}
                versionId: {type: string}
                action: {type: string, enum: [start, pause, skip]}
                clientOccurredAt: {type: string, format: date-time}
      responses:
        '200': {description: eventId and resulting current state}
        '409': {description: IDEMPOTENCY_CONFLICT}
        '422': {description: CONTEXT_MISMATCH or INVALID_ACTION}
components:
  responses:
    ContentNotFound:
      description: LESSON_NOT_FOUND, AUDIO_NOT_FOUND or LICENSE_NOT_FOUND with normalized Problem JSON
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: DATABASE_UNAVAILABLE or AUDIO_UNAVAILABLE; no filesystem paths or credentials in detail
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    LocalOnly:
      description: Host or Origin is outside configured localhost/127.0.0.1 ports; no wildcard CORS
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    LearningCommand:
      type: object
      required: [eventId, lessonId, versionId, sentenceId, clientOccurredAt]
      properties:
        eventId: {type: string, format: uuid, maxLength: 36}
        lessonId: {type: string, maxLength: 64}
        versionId: {type: string, maxLength: 64}
        sentenceId: {type: string, maxLength: 64}
        clientOccurredAt: {type: string, format: date-time, maxLength: 40, description: Untrusted client time; recordedAt is server UTC}
    DraftSnapshot:
      type: object
      required: [text, rowVersion]
      properties:
        text: {type: string}
        rowVersion: {type: integer, minimum: 0}
    TokenResult:
      type: object
      required: [correct, algorithmVersion, edits]
      properties:
        correct: {type: boolean}
        algorithmVersion: {type: string, const: english_token_v1}
        edits:
          type: array
          items:
            type: object
            properties:
              kind: {type: string, enum: [equal, omit, insert, replace]}
              expected: {type: string}
              actual: {type: string}
              expectedIndex: {type: integer, minimum: 0}
              actualIndex: {type: integer, minimum: 0}
    Checkpoint:
      type: object
      required: [lessonId, versionId, sentenceId, tab, showEnglish, showTranslation]
      properties:
        lessonId: {type: string, minLength: 1, maxLength: 64}
        versionId: {type: string, minLength: 1, maxLength: 64}
        sentenceId: {type: string, minLength: 1, maxLength: 64}
        tab: {type: string, enum: [text, dictation, vocabulary, speaking, writing, quiz]}
        showEnglish: {type: boolean}
        showTranslation: {type: boolean}
        playingSentenceId: {type: [string, "null"], maxLength: 64}
        positionMs: {type: integer, minimum: 0, maximum: 600000}
    Book:
      type: object
      required: [id, catalogKey, sequence, title, editionLabel, availability, declaredLessonCount, metadataSource]
      properties:
        id: {type: string}
        catalogKey: {type: string}
        sequence: {type: integer}
        title: {type: string}
        editionLabel: {type: string}
        availability: {type: string, const: catalog_only}
        declaredLessonCount: {type: integer}
        metadataSource: {type: string}
    LessonSummary:
      type: object
      required: [id, slug, kind, availability, bookId, versionId, title, releaseReady, usageScope]
      properties:
        id: {type: string}
        slug: {type: string}
        kind: {type: string, const: original_demo}
        availability: {type: string, const: available}
        bookId: {type: 'null'}
        versionId: {type: string}
        title: {type: string}
        releaseReady: {type: boolean, const: false}
        usageScope: {type: string, const: local_test_only}
    ContentLicense:
      type: object
      required: [id, sourceType, medium, owner, sourceRef, rightsScope, territory, reviewStatus, proofRef, generator, voice, declaration]
      properties:
        id: {type: string}
        sourceType: {type: string, const: original}
        medium: {type: string, enum: [text, audio]}
        owner: {type: string}
        sourceRef: {type: string}
        rightsScope: {type: string}
        territory: {type: string}
        reviewStatus: {type: string, const: pending_review}
        proofRef: {type: ['string', 'null']}
        generator: {type: string}
        voice: {type: string}
        declaration: {type: string}
    Sentence:
      type: object
      required: [id, stableKey, sequence, speaker, text, translation, explanation, focus, audioAssetId, startMs, endMs, audio]
      properties:
        id: {type: string}
        stableKey: {type: string}
        sequence: {type: integer, minimum: 1, maximum: 10}
        speaker: {type: string}
        text: {type: string}
        translation: {type: string}
        explanation: {type: string}
        focus: {type: string}
        audioAssetId: {type: string}
        startMs: {type: integer, const: 0}
        endMs: {type: integer, minimum: 1}
        audio:
          type: object
          required: [id, licenseId, sourceKind, mimeType, byteSize, durationMs, sha256, status, uri]
          properties:
            id: {type: string}
            licenseId: {type: string}
            sourceKind: {type: string, const: original_tts}
            mimeType: {type: string, const: audio/mpeg}
            byteSize: {type: integer, minimum: 1}
            durationMs: {type: integer, minimum: 1}
            sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            status: {type: string, const: ready}
            uri: {type: string}
    Problem:
      type: object
      required: [type, title, status, code, detail, instance, traceId, retryable, fieldErrors]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        traceId: {type: string, format: uuid}
        retryable: {type: boolean}
        fieldErrors: {type: array, items: {type: object}}
