openapi: 3.1.0
info:
  title: Northstar English Local API
  version: 0.8.0
  description: Phase 08 adds evidence reports, persisted preferences, logical snapshots and read-only import preview. Restores create new isolated databases only. Source/voice rights pending review; formal publication blocked.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Query actual MySQL project identity, settings and migration version
      responses:
        '200':
          description: Database available and project identity valid; Cache-Control no-store
          headers:
            X-Northstar-Test-Database: {schema: {type: string, enum: ["true", "false"]}, description: True only when SELECT DATABASE() matches the isolated test schema; write E2E requires true}
          content:
            application/json:
              schema:
                type: object
                required: [status, database, project, migrationVersion, checkedAt]
                properties:
                  status: {type: string, const: UP}
                  database: {type: string, const: UP}
                  project: {type: string, const: northstar-english-local-v1}
                  migrationVersion: {type: string}
                  checkedAt: {type: string, format: date-time}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '503':
          description: MySQL unavailable or identity invalid; never a simulated UP
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Actual feature boundaries for this phase
          content:
            application/json:
              schema:
                type: object
                required: [phase, contentApiAvailable, learningContentAvailable, aiEnabled, asrEnabled, pronunciationScoringEnabled]
                properties:
                  phase: {type: string, const: '08'}
                  contentApiAvailable: {type: boolean, const: true}
                  learningContentAvailable: {type: boolean, const: true}
                  aiEnabled: {type: boolean, const: false}
                  asrEnabled: {type: boolean, const: false}
                  pronunciationScoringEnabled: {type: boolean, const: false}
        '403': {$ref: '#/components/responses/LocalOnly'}
  /settings:
    get:
      operationId: getLocalSettings
      description: Persisted local preferences. PUT uses rowVersion optimistic concurrency.
      responses:
        '200':
          description: Persisted local preferences, no credentials
          content:
            application/json:
              schema:
                type: object
                required: [timezone, defaultSpeed, showTranslation, showHints, shortcutEnabled, recordingRetention, recordingEnabled, rowVersion]
                properties:
                  timezone: {type: string, example: Asia/Shanghai}
                  defaultSpeed: {type: number, enum: [0.75, 1, 1.25, 1.5]}
                  showTranslation: {type: boolean}
                  showHints: {type: boolean}
                  shortcutEnabled: {type: boolean}
                  recordingEnabled: {type: boolean}
                  recordingRetention: {type: string, const: manual}
                  rowVersion: {type: integer, minimum: 0}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    put:
      operationId: updateLocalSettings
      description: Same-origin JSON only. Preserves timezone and manual retention. A stale rowVersion is rejected; successful writes increment it exactly once.
      parameters: [{$ref: '#/components/parameters/LocalRequest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultSpeed, showTranslation, showHints, shortcutEnabled, recordingEnabled, rowVersion]
              properties:
                defaultSpeed: {type: number, enum: [0.75, 1, 1.25, 1.5]}
                showTranslation: {type: boolean}
                showHints: {type: boolean}
                shortcutEnabled: {type: boolean}
                recordingEnabled: {type: boolean}
                rowVersion: {type: integer, minimum: 0}
      responses:
        '200': {description: Persisted; returns committed rowVersion}
        '409': {description: Stale revision; reread and preserve unsaved changes}
        '422': {description: Unsupported playback speed}
        '403': {$ref: '#/components/responses/LocalOnly'}
  /reports:
    get:
      operationId: getLearningReport
      description: Repeatable-read snapshot across all preserved lesson versions. Includes metrics, six paths per version and readingHistory. Browsing is separate from five evidence-based training stages; skip/play/favorite/draft is not an attempt. No language ability scores.
      responses:
        '200':
          description: Actual counts; metrics.dictation includes submitted/exactMatches and independentSubmitted/independentMatches excluding answer_exposed. Reading correct/submitted; recordings recorded/available/deleted; writing versions; quiz correct/total/runs; review due/cards; selfRatings submitted. Zero means no sample, not a fabricated percentage.
        '503': {description: Database unavailable; no simulated report}
        '403': {$ref: '#/components/responses/LocalOnly'}
  /data/export:
    get:
      operationId: exportLearningSnapshot
      description: Private repeatable-read logical DB snapshot; includes original answers and writing. No credentials. Media binaries and unsynced browser buffers are excluded explicitly. All SQL cells are strings or null; tables and columns are fixed to the current schema.
      responses:
        '200':
          description: northstar.snapshot.v1 envelope with raw UTF-8 payloadJson and its SHA-256; owner local, project identity, schemaVersion from the actual Flyway history, exportedAt, mediaIncluded false, browserBuffersIncluded false, tables. No-store.
          content:
            application/json:
              schema:
                type: object
                required: [format, sha256, payloadJson]
                additionalProperties: false
                properties:
                  format: {type: string, const: northstar.snapshot.v1}
                  sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                  payloadJson: {type: string}
        '503': {description: Export failed; no successful empty substitute}
        '403': {$ref: '#/components/responses/LocalOnly'}
  /data/import-preview:
    post:
      operationId: previewLearningImport
      description: Read-only preflight of export envelope. Validates checksum, local ownership, schema 008, exact tables/columns, content and Flyway baseline. Does not apply data or prove row-level business integrity. CLI restore enforces DB constraints in a new isolated schema; refuses existing targets and missing ready-media binaries.
      parameters: [{$ref: '#/components/parameters/LocalRequest'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [format, sha256, payloadJson]}
      responses:
        '200': {description: valid true, sha256, tableCounts, mode new_isolated_database_only, warning and mediaIncluded false; no writes}
        '422': {description: Invalid or incompatible snapshot; no writes}
        '403': {$ref: '#/components/responses/LocalOnly'}
  /books:
    get:
      operationId: getBooks
      description: Real book metadata and counts, with separate available standalone lessons (bookId null). Declared counts do not mean imported content.
      responses:
        '200':
          description: Catalog metadata; no-store
          content:
            application/json:
              schema:
                type: object
                required: [books, standaloneLessons]
                properties:
                  books:
                    type: array
                    items: {$ref: '#/components/schemas/Book'}
                  standaloneLessons:
                    type: array
                    items: {$ref: '#/components/schemas/LessonSummary'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /lessons:
    get:
      operationId: listAvailableLessons
      responses:
        '200':
          description: Available real lessons in the unchanged array contract; no placeholder lessons
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LessonSummary'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /books/{id}/lessons:
    get:
      operationId: listBookLessons
      description: Actual rows only, ordered by sequence (null last) then immutable ID. Cursor is bound to book and ordering keys. Unavailable rows have no version or content title; no content body or media is exposed. Stable while the catalog is unchanged; no concurrent-publish snapshot guarantee.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 600}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Empty books return items=[], nextCursor=null; never populate declared textbook lesson counts
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, bookId, sequence, displayNumber, availability, readable, versionId, title]
                      properties:
                        id: {type: string}
                        bookId: {type: string}
                        sequence: {type: [integer, 'null']}
                        displayNumber: {type: [string, 'null']}
                        availability: {type: string, enum: [draft, available, withdrawn]}
                        readable: {type: boolean}
                        versionId: {type: [string, 'null']}
                        title: {type: [string, 'null']}
                  nextCursor: {type: [string, 'null']}
        '400': {description: INVALID_CURSOR or INVALID_LIMIT}
        '404': {description: BOOK_NOT_FOUND}
  /lessons/{id}/versions:
    get:
      operationId: listLessonVersions
      description: Readable versions ordered by number and ID. Publication state and content readiness are independent. Withdrawn versions remain listed as unreadable; scores and drafts are never copied across versions. Old Demo retains its existing local-test exception; other pending-rights content is inaccessible.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: fromVersion, in: query, required: false, schema: {type: string}}
        - {name: fromSentence, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Version list, current indicator does not change historical learning associations
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      required: [versionId, number, isCurrent, readable]
                      properties:
                        versionId: {type: string}
                        number: {type: integer, minimum: 1}
                        isCurrent: {type: boolean}
                        readable: {type: boolean}
                        publicationState: {$ref: '#/components/schemas/PublicationState'}
                        contentReadiness: {$ref: '#/components/schemas/ContentReadiness'}
                        targetSentenceId: {type: string, description: Navigation target from a confirmed one-to-one mapping only}
                        mappingStatus: {type: string, enum: [unmapped, confirmed, no_target, ambiguous]}
                        relation: {type: string, enum: [equivalent, edited]}
        '422': {description: VERSION_LESSON_MISMATCH for a foreign source sentence}
        '404': {description: LESSON_NOT_FOUND for unknown or inaccessible lessons}
  /lessons/{id}:
    get:
      operationId: getLesson
      parameters:
        - {name: versionId, in: query, required: false, schema: {type: string}, example: demo-01-v2}
        - {name: id, in: path, required: true, schema: {type: string}, example: demo-01}
      description: Current or explicitly selected readable version. Ordered relational paragraphs and sentences may have different counts per version. Frozen Demo remains unchanged. Answer keys stay server-side; corrupt or missing audio retains the existing whole-lesson 503 contract. Historical learning records stay bound to their version.
      responses:
        '200':
          description: Immutable version projection; legacy Demo keeps releaseReady=false and local_test_only
          content:
            application/json:
              schema:
                type: object
                required: [id, versionId, version, title, bookId, kind, availability, sentences, vocabulary, exercises, licenses, releaseReady, usageScope, explanationLabel]
                properties:
                  id: {type: string}
                  versionId: {type: string}
                  version: {type: integer, minimum: 1}
                  title: {type: string}
                  bookId: {type: ['string', 'null']}
                  kind: {type: string, enum: [original_demo, original, licensed]}
                  availability: {type: string, const: available}
                  usageScope: {type: string, const: local_test_only}
                  publicationState: {$ref: '#/components/schemas/PublicationState'}
                  contentReadiness: {$ref: '#/components/schemas/ContentReadiness'}
                  hasHistoricalEvidence: {type: boolean, description: Reference only for reviewed equivalent mappings; never mastery evidence}
                  releaseReady: {type: boolean}
                  explanationLabel: {type: string}
                  projectionVersion: {type: string, const: relational-v1}
                  paragraphs:
                    type: array
                    items:
                      type: object
                      required: [id, stableKey, sequence]
                      properties:
                        id: {type: string}
                        stableKey: {type: string}
                        identityId: {type: string}
                        sequence: {type: integer, minimum: 1}
                  availableTasks: {type: array, items: {type: string}}
                  hasWritingTask: {type: boolean}
                  sentences:
                    type: array
                    minItems: 1
                    items: {$ref: '#/components/schemas/Sentence'}
                  vocabulary:
                    type: array
                    items:
                      type: object
                      required: [id, term, meaning, example, sentenceIds]
                      properties:
                        id: {type: string}
                        term: {type: string}
                        meaning: {type: string}
                        example: {type: string}
                        sentenceIds: {type: array, items: {type: string}}
                  exercises:
                    type: array
                    items:
                      type: object
                      required: [id, kind, prompt, sentenceIds]
                      properties:
                        id: {type: string}
                        kind: {type: string, enum: [dictation, reading_choice, writing_prompt, quiz_choice]}
                        prompt: {type: string}
                        sentenceIds: {type: array, items: {type: string}}
                        options:
                          type: array
                          items:
                            type: object
                            required: [id, text]
                            properties:
                              id: {type: string}
                              text: {type: string}
                        targetExpressions: {type: array, items: {type: string}}
                  licenses:
                    type: array
                    items: {$ref: '#/components/schemas/ContentLicense'}
        '410': {description: VERSION_WITHDRAWN; historical evidence and local buffers are retained}
        '404': {$ref: '#/components/responses/ContentNotFound'}
        '422': {description: VERSION_LESSON_MISMATCH for a known version belonging to another lesson}
        '503': {$ref: '#/components/responses/Unavailable'}
  /licenses/{id}:
    get:
      operationId: getContentLicense
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: demo-audio-v1}
      responses:
        '200':
          description: Declared provenance and review status; unknown fields never imply confirmed rights
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentLicense'}
        '404': {$ref: '#/components/responses/ContentNotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /audio/{id}:
    get:
      operationId: getSentenceAudio
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}, example: demo-01-v1-a01}
        - {name: Range, in: header, required: false, schema: {type: string}, example: 'bytes=0-31'}
      description: Reads only a database-resolved, root-contained file with matching size and SHA-256. Never accepts filesystem paths. Sentence-local MP3; no whole-lesson time alignment.
      responses:
        '200':
          description: Full MP3; Accept-Ranges bytes and Cache-Control no-store
          content:
            audio/mpeg:
              schema: {type: string, format: binary}
        '206':
          description: Requested MP3 byte range; Content-Range bytes start-end/size
          content:
            audio/mpeg:
              schema: {type: string, format: binary}
        '410': {description: VERSION_WITHDRAWN; course media is no longer distributed}
        '404': {$ref: '#/components/responses/ContentNotFound'}
        '416':
          description: Malformed or unsatisfiable byte range; Content-Range bytes */size. Spring Resource response may have an empty body.
        '503': {$ref: '#/components/responses/Unavailable'}
  /study/resume:
    get:
      operationId: getBrowsingCheckpoint
      summary: Read the local browsing checkpoint; never exercise evidence
      responses:
        '200':
          description: Persisted checkpoint with ETag equal to quoted rowVersion; Cache-Control no-store
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Checkpoint'}
                  - type: object
                    required: [sessionId, rowVersion]
                    properties:
                      sessionId: {type: string, format: uuid}
                      rowVersion: {type: integer, minimum: 1}
        '204': {description: No checkpoint has been saved}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '503': {description: Local database unavailable}
    put: &saveCheckpoint
      operationId: saveBrowsingCheckpoint
      description: Requires allowed loopback Origin, application/json and X-Northstar-Request local-workspace. If-Match is the quoted prior revision, initially "0". Atomic revision check rejects other-page conflicts. Optional playingSentenceId and sentence-local positionMs restore paused. No training evidence or drafts are stored here.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: {type: string, pattern: '^"[0-9]{1,16}"$'}
        - in: header
          name: X-Northstar-Request
          required: true
          schema: {type: string, const: local-workspace}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Checkpoint'}
      responses:
        '200':
          description: Checkpoint saved; new revision and matching ETag. Response body only contains rowVersion.
          content:
            application/json:
              schema:
                type: object
                required: [rowVersion]
                properties:
                  rowVersion: {type: integer, minimum: 1}
        '400': {description: Invalid tab, boolean, revision or request body; Problem JSON}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '404': {description: Unavailable lesson, unknown version or foreign sentence; Problem JSON}
        '412': {description: Another page has changed the checkpoint; preserve local draft and reload; Problem JSON}
        '428': {description: If-Match missing; Problem JSON}
        '503': {description: Local database or checkpoint write grant unavailable; Problem JSON}
  /study/sessions:
    post:
      <<: *saveCheckpoint
      operationId: openBrowsingSession
      summary: Initialize or update the singleton local browsing session with the same revision rules
  /drafts/{sentence}:
    parameters:
      - {name: sentence, in: path, required: true, schema: {type: string}}
    get:
      operationId: getDictationDraft
      parameters:
        - {name: lessonId, in: query, required: true, schema: {type: string}}
        - {name: versionId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Text plus rowVersion; empty draft returns text empty and rowVersion 0
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DraftSnapshot'}
        '422': {description: Target does not belong to the available lesson/version}
    put:
      operationId: saveDictationDraft
      description: Local Origin, JSON and X-Northstar-Request local-workspace required. If-Match uses quoted prior revision, initially "0". Conflict never overwrites the server draft.
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lessonId, versionId, text]
              properties:
                lessonId: {type: string, maxLength: 64}
                versionId: {type: string, maxLength: 64}
                text: {type: string, maxLength: 10000}
      responses:
        '200': {description: Saved; body contains new rowVersion}
        '400': {description: Invalid payload or quoted revision}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '412': {description: DRAFT_VERSION_CONFLICT; retain local and server copies for explicit resolution}
        '422': {description: Invalid lesson/version/sentence binding}
        '428': {description: If-Match is required}
        '503': {$ref: '#/components/responses/Unavailable'}
  /exercises/{id}/attempts:
    post:
      operationId: submitDictation
      description: Exercise id is sentenceId-dictation. All writes require local Origin, JSON and X-Northstar-Request local-workspace. UUID is persisted in IndexedDB before sending. Same operation and payload replay the original response; different payload with same UUID returns 409. Receipt, attempt, evidence, stage and optional review source commit atomically. audioPlayed is a browser playback observation, not a professional or server-side listening assessment. Server independently verifies source readiness, size and SHA-256.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/LearningCommand'}
                - type: object
                  required: [text, audioPlayed, answerExposed]
                  properties:
                    text: {type: string, maxLength: 10000}
                    audioPlayed: {type: boolean}
                    answerExposed: {type: boolean}
      responses:
        '200':
          description: A real attempt, including incorrect submissions, is practiced; original input and aligned token edits returned
          content:
            application/json:
              schema:
                type: object
                required: [attemptId, eventId, evidenceId, state, rawText, standardText, result, answerExposed, reviewItemId]
                properties:
                  attemptId: {type: string, format: uuid}
                  eventId: {type: string, format: uuid}
                  evidenceId: {type: string, format: uuid}
                  state: {type: string, const: practiced}
                  rawText: {type: string}
                  standardText: {type: string}
                  answerExposed: {type: boolean}
                  reviewItemId: {type: string, description: Empty if correct; stable per sentence otherwise}
                  result: {$ref: '#/components/schemas/TokenResult'}
        '400': {description: Invalid UUID, timestamp or payload}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '409': {description: IDEMPOTENCY_CONFLICT; same eventId cannot change operation or payload}
        '422': {description: EMPTY_ANSWER, AUDIO_NOT_PLAYED or CONTEXT_MISMATCH; no evidence persisted}
        '503': {$ref: '#/components/responses/Unavailable'}
  /study/events:
    post:
      operationId: recordStudyAction
      description: Same local write headers and UUID replay contract as attempts. Only start/skip/pause accepted. Never creates an attempt, evidence or increments practiceCount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/LearningCommand'}
                - type: object
                  required: [action]
                  properties:
                    action: {type: string, enum: [start, skip, pause]}
      responses:
        '200': {description: eventId and state in_progress/skipped/paused; historical evidence retained}
        '400': {description: Invalid payload, UUID or timestamp}
        '403': {$ref: '#/components/responses/LocalOnly'}
        '409': {description: IDEMPOTENCY_CONFLICT}
        '422': {description: Invalid action or context; practiced/correct cannot be reported directly}
        '503': {$ref: '#/components/responses/Unavailable'}
  /study/stages:
    get:
      operationId: getDictationStages
      parameters:
        - {name: lessonId, in: query, required: true, schema: {type: string}}
        - {name: versionId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: One item per sentence; current round state and historical attempt count are separate
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sentenceId: {type: string}
                    state: {type: string, enum: [not_started, in_progress, practiced, skipped, paused]}
                    practiceCount: {type: integer, minimum: 0}
  /reviews/items:
    get:
      operationId: getReviewSources
      description: One row per incorrect attempt source, grouped by stable item id in UI. Reading and dictation share sentence cards and retain distinct error sources. No scheduling or mastery score.
      responses:
        '200':
          description: All pending sources; empty array when there are no errors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    status: {type: string, const: pending}
                    attemptId: {type: string, format: uuid}
                    lessonId: {type: string}
                    versionId: {type: string}
                    sentenceId: {type: string}
                    exerciseId: {type: string}
                    sequence: {type: integer}
                    rawText: {type: string}
                    standardText: {type: string}
                    reason: {type: string, enum: [dictation_token_difference, reading_evidence_mismatch]}
                    kind: {type: string, enum: [dictation, reading_choice]}
                    knowledgePointId: {type: [string, "null"]}
                    optionId: {type: [string, "null"]}
                    recordedAt: {type: string, description: UTC server time}
        '503': {$ref: '#/components/responses/Unavailable'}
  /reading:
    get:
      operationId: getReading
      description: Read versioned vocabulary and reading questions with saved favorites and immutable history. Answer keys are omitted; previous submitted feedback remains in history. Does not create practice evidence.
      parameters:
        - {name: lessonId, in: query, required: true, schema: {type: string}}
        - {name: versionId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: vocabulary entries (id, sentenceId, sequence, sourceText, term, meaning, usageNote, example, favorite boolean), questions (stable id, prompt, options, knowledgePointId, sentenceId, current state, history). History rows contain attemptId, eventId, optionId, correct, resultJson and recordedAt.
        '422': {description: CONTEXT_MISMATCH - lesson/version mismatch}
  /knowledge/{id}/favorite:
    put:
      operationId: saveVocabularyFavorite
      description: Set desired favorite state; repeated identical PUTs are safe. Does not imply mastery, practice or error review. Same-origin write headers required.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lessonId, versionId, favorite]
              properties:
                lessonId: {type: string}
                versionId: {type: string}
                favorite: {type: boolean}
      responses:
        '200': {description: Persisted favorite boolean}
        '422': {description: CONTEXT_MISMATCH - word does not belong to this lesson/version}
  /reading/{id}/attempts:
    post:
      operationId: submitReadingAttempt
      description: Grade server-side by stable option ID. Transactionally save attempt, option, immutable result, evidence and practiced state; incorrect answers append knowledge-linked review sources. Same eventId/payload replays receipt; changed payload conflicts. Same-origin write headers required.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, lessonId, versionId, optionId, clientOccurredAt]
              properties:
                eventId: {type: string, format: uuid}
                lessonId: {type: string}
                versionId: {type: string}
                optionId: {type: string}
                clientOccurredAt: {type: string, format: date-time}
      responses:
        '200': {description: Receipt with attemptId, eventId, evidenceId, state practiced and result (correct, correctOptionId, correctText, sentenceId, knowledgePointId, standardText, explanation, algorithmVersion)}
        '409': {description: IDEMPOTENCY_CONFLICT - event reused with another payload}
        '422': {description: CONTEXT_MISMATCH or INVALID_OPTION - no receipt/attempt committed}
  /reading/{id}/events:
    post:
      operationId: changeReadingRound
      description: Idempotent start/pause/skip changes current round only; immutable attempt history is retained. No practice evidence is created. Same-origin write headers required.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, lessonId, versionId, action, clientOccurredAt]
              properties:
                eventId: {type: string, format: uuid}
                lessonId: {type: string}
                versionId: {type: string}
                action: {type: string, enum: [start, pause, skip]}
                clientOccurredAt: {type: string, format: date-time}
      responses:
        '200': {description: eventId and resulting current state}
        '409': {description: IDEMPOTENCY_CONFLICT}
        '422': {description: CONTEXT_MISMATCH or INVALID_ACTION}
  /writing:
    get:
      summary: Read the versioned original writing task, source sentence IDs, draft, state and immutable revision history
      parameters:
        - {name: lessonId, in: query, required: true, schema: {type: string}}
        - {name: versionId, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Task and history; no grammar or ability scoring}
        '422': {description: Course/version mismatch}
  /writing/draft:
    put:
      summary: Save draft with optimistic rowVersion; zero creates, existing writes increment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lessonId, versionId, text, rowVersion]
              properties:
                lessonId: {type: string}
                versionId: {type: string}
                text: {type: string, maxLength: 10000}
                rowVersion: {type: integer, minimum: 0}
      responses:
        '200': {description: New rowVersion; draft alone creates no evidence}
        '412': {description: Draft conflict; preserve client text and compare}
  /writing/revisions:
    post:
      summary: Idempotently save a nonempty immutable revision; allocate next number under draft row lock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, lessonId, versionId, text, draftVersion]
              properties:
                eventId: {type: string, format: uuid}
                lessonId: {type: string}
                versionId: {type: string}
                text: {type: string, minLength: 1, maxLength: 10000}
                draftVersion: {type: integer, minimum: 1}
                parentRevisionId: {type: [string, 'null'], format: uuid}
      responses:
        '200': {description: Revision id, server versionNo, practiced state and new learning evidence}
        '409': {description: Same eventId with different payload}
        '412': {description: Draft version/text not current}
        '422': {description: Parent revision belongs to another task}
  /recordings:
    get:
      summary: List current available or missing local recordings and per-sentence state; deleted files excluded
      parameters:
        - {name: lessonId, in: query, required: true, schema: {type: string}}
        - {name: versionId, in: query, required: true, schema: {type: string}}
        - {name: sentenceId, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Recordings with stable IDs, MIME, client duration, timestamp, status and playback count}
    post:
      summary: Idempotent bounded JSON/base64 upload; private atomic file then pending metadata then ready; startup reconciles missing files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, lessonId, versionId, sentenceId, createdAt, mimeType, durationMs, audioBase64]
              properties:
                eventId: {type: string, format: uuid}
                lessonId: {type: string}
                versionId: {type: string}
                sentenceId: {type: string}
                createdAt: {type: string, format: date-time}
                mimeType: {type: string, enum: ['audio/webm', 'audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg', 'audio/ogg;codecs=opus']}
                durationMs: {type: integer, minimum: 250, maximum: 120000, description: Client observed recording time, not speech analysis}
                audioBase64: {type: string, maxLength: 11184812, description: 32 bytes to 8 MiB decoded; MIME/container header checked, decoding observed in browser}
      responses:
        '200': {description: Stable recording ID; upload creates no practiced evidence}
        '409': {description: Event payload conflict}
        '413': {description: File size invalid}
        '415': {description: Unsupported MIME or container signature}
        '422': {description: Course/version/sentence mismatch}
        '503': {description: File persistence failed; retain IndexedDB buffer}
  /recordings/{id}/audio:
    get:
      summary: Return checked ready private recording bytes with original MIME and no-store
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Actual recording bytes}
        '404': {description: Deleted, missing or unavailable file}
  /recordings/{id}/playbacks:
    post:
      summary: Idempotent client-observed playback and optional human self-rating; never pronunciation grading
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, lessonId, versionId, sentenceId, observedMs, selfRating]
              properties:
                eventId: {type: string, format: uuid}
                lessonId: {type: string}
                versionId: {type: string}
                sentenceId: {type: string}
                observedMs: {type: integer, minimum: 250}
                selfRating: {type: string, enum: [replay_only, try_again, satisfied]}
      responses:
        '200': {description: Playback observation, learning evidence and practiced state}
        '422': {description: No ready recording for this sentence or invalid observation}
  /recordings/{id}/ratings:
    post:
      summary: Save an immutable human rating receipt linked to a validated playback; never add playback count or practice evidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, lessonId, versionId, sentenceId, playbackEventId, selfRating]
              properties:
                eventId: {type: string, format: uuid}
                lessonId: {type: string}
                versionId: {type: string}
                sentenceId: {type: string}
                playbackEventId: {type: string, format: uuid}
                selfRating: {type: string, enum: [try_again, satisfied]}
      responses:
        '200': {description: Immutable command receipt with recordingId/playbackEventId/selfRating; no extra observation or evidence}
        '409': {description: Event payload conflict}
        '422': {description: Missing actual playback or context mismatch}
  /recordings/{id}/delete:
    post:
      summary: Confirmed idempotent tombstone before unlink; preserve past evidence; retry interrupted unlink
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, confirmed]
              properties:
                eventId: {type: string, format: uuid}
                confirmed: {type: boolean, const: true}
      responses:
        '200': {description: Deleted current file; evidence retained}
        '422': {description: Confirmation required}
  /practice/events:
    post:
      summary: Idempotent start, pause or skip for speaking/writing; never direct completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, lessonId, versionId, kind, action]
              properties:
                eventId: {type: string, format: uuid}
                lessonId: {type: string}
                versionId: {type: string}
                sentenceId: {type: string, description: Required for speaking; writing resolves task sources}
                kind: {type: string, enum: [speaking, writing]}
                action: {type: string, enum: [start, pause, skip]}
      responses:
        '200': {description: New current state; no learning evidence created}
        '422': {description: Invalid context or direct completion request}
  /quiz:
    get:
      operationId: getQuiz
      summary: Three frozen questions without answer keys and all immutable run/answer history
      parameters:
        - {name: lessonId, in: query, required: true, schema: {type: string}}
        - {name: versionId, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: questions, state, history with run IDs, correctCount, UTC submittedAt and per-question attempt/option/result snapshots}
        '422': {description: Course/version mismatch}
  /quiz/attempts:
    post:
      operationId: submitQuizRun
      summary: Atomically submit all three choices; one run, three attempts and evidence; wrong answers append deduplicated card sources
      description: Parent eventId is retained on quiz_run; stable child UUIDs derive from parent and exercise ID. Same event/payload replays before business validation; different payload conflicts. Redo uses a new parent event. Draft selections are browser IndexedDB only and are not evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, lessonId, versionId, answers, clientOccurredAt]
              properties:
                eventId: {type: string, format: uuid}
                lessonId: {type: string, maxLength: 64}
                versionId: {type: string, maxLength: 64}
                answers: {type: object, minProperties: 3, maxProperties: 3, additionalProperties: {type: string}, description: Frozen exercise ID to its option ID}
                clientOccurredAt: {type: string, format: date-time}
      responses:
        '200': {description: runId, correctCount and individual result snapshots with source sentence/knowledge point and explanation}
        '409': {description: Same event with different payload}
        '422': {description: Incomplete questions, invalid option or course/version mismatch; entire transaction rolled back}
  /quiz/events:
    post:
      operationId: recordQuizState
      summary: Explicit start/pause/skip updates current state without creating attempts or review success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, lessonId, versionId, action, clientOccurredAt]
              properties:
                eventId: {type: string, format: uuid}
                lessonId: {type: string}
                versionId: {type: string}
                action: {type: string, enum: [start, pause, skip]}
                clientOccurredAt: {type: string, format: date-time}
      responses:
        '200': {description: Current state; no evidence generated}
        '409': {description: Same event with different payload}
        '422': {description: Invalid context or action}
  /reviews/due:
    get:
      operationId: getReviewSchedule
      summary: Real due cards with source attempts, rowVersion, UTC dueAt and immutable self-rating history; no English answers
      description: Card uniqueness is local owner + version + target knowledge point (or dictation sentence) + card kind. The UI fetches all metadata to recover pending accepted-but-unacknowledged operations even if the due time has advanced, then filters to due/pending cards.
      parameters:
        - {name: all, in: query, schema: {type: boolean, default: false}, description: Also include future scheduled cards}
      responses:
        '200': {description: Array of cards with source course/version/sentence/exercise/attempt IDs; empty array when none}
  /reviews/{id}/answer:
    get:
      operationId: revealReviewAnswer
      summary: Fetch the source English sentence and local preset explanation only after explicit flip
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Source text, local explanation and linked original wrong attempts; fetched after flip only; no AI or measured mastery claim}
        '404': {description: Unknown card}
  /reviews/{id}/results:
    post:
      operationId: rateReviewCard
      summary: Idempotent self-rating under card row lock and expected rowVersion
      description: simple_v1 uses server UTC time. Again schedules 60 seconds and resets success streak; good schedules 1,2,4,8,16,32 days capped at 32. A new genuine error reactivates the same card and invalidates stale card versions. Self-rating is never objective mastery. Retry first replays receipt even after card version or due time changed.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/LearningCommand'}
                - type: object
                  required: [rowVersion, rating, answerRevealed]
                  properties:
                    rowVersion: {type: integer, minimum: 1}
                    rating: {type: string, enum: [again, good]}
                    answerRevealed: {type: boolean, const: true, description: Client-observed flip; not server-measured recall}
      responses:
        '200': {description: eventId, nextDueAt with explicit UTC Z, new rowVersion, origin=self_rating, schedulerVersion=simple_v1}
        '404': {description: Unknown card}
        '409': {description: Stale rowVersion, future card or conflicting event payload; no extra history}
        '422': {description: Invalid context, rating or missing flip}
components:
  parameters:
    LocalRequest:
      name: X-Northstar-Request
      in: header
      required: true
      schema: {type: string, const: local-workspace}
  responses:
    ContentNotFound:
      description: LESSON_NOT_FOUND, AUDIO_NOT_FOUND or LICENSE_NOT_FOUND with normalized Problem JSON
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: DATABASE_UNAVAILABLE or AUDIO_UNAVAILABLE; no filesystem paths or credentials in detail
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    LocalOnly:
      description: Host or Origin is outside configured localhost/127.0.0.1 ports; no wildcard CORS
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    LearningCommand:
      type: object
      required: [eventId, lessonId, versionId, sentenceId, clientOccurredAt]
      properties:
        eventId: {type: string, format: uuid, maxLength: 36}
        lessonId: {type: string, maxLength: 64}
        versionId: {type: string, maxLength: 64}
        sentenceId: {type: string, maxLength: 64}
        clientOccurredAt: {type: string, format: date-time, maxLength: 40, description: Untrusted client time; recordedAt is server UTC}
    DraftSnapshot:
      type: object
      required: [text, rowVersion]
      properties:
        text: {type: string}
        rowVersion: {type: integer, minimum: 0}
    TokenResult:
      type: object
      required: [correct, algorithmVersion, edits]
      properties:
        correct: {type: boolean}
        algorithmVersion: {type: string, const: english_token_v1}
        edits:
          type: array
          items:
            type: object
            properties:
              kind: {type: string, enum: [equal, omit, insert, replace]}
              expected: {type: string}
              actual: {type: string}
              expectedIndex: {type: integer, minimum: 0}
              actualIndex: {type: integer, minimum: 0}
    Checkpoint:
      type: object
      required: [lessonId, versionId, sentenceId, tab, showEnglish, showTranslation]
      properties:
        lessonId: {type: string, minLength: 1, maxLength: 64}
        versionId: {type: string, minLength: 1, maxLength: 64}
        sentenceId: {type: string, minLength: 1, maxLength: 64}
        tab: {type: string, enum: [text, dictation, vocabulary, speaking, writing, quiz]}
        showEnglish: {type: boolean}
        showTranslation: {type: boolean}
        playingSentenceId: {type: [string, "null"], maxLength: 64}
        positionMs: {type: integer, minimum: 0, maximum: 600000}
    Book:
      type: object
      required: [id, catalogKey, sequence, title, editionLabel, availability, declaredLessonCount, metadataSource]
      properties:
        id: {type: string}
        catalogKey: {type: string}
        sequence: {type: integer}
        title: {type: string}
        editionLabel: {type: string}
        availability: {type: string, const: catalog_only}
        declaredLessonCount: {type: integer}
        actualLessonCount: {type: integer, minimum: 0}
        availableLessonCount: {type: integer, minimum: 0}
        metadataSource: {type: string}
    PublicationState:
      type: string
      enum: [draft, validated, published, withdrawn]
    ContentReadiness:
      type: string
      enum: [legacy_unassessed, basic_content, teaching_complete]
      description: teaching_complete is reserved; Phase10B3 does not grant it
    LessonSummary:
      type: object
      required: [id, slug, kind, availability, bookId, versionId, title, releaseReady, usageScope]
      properties:
        id: {type: string}
        slug: {type: string}
        kind: {type: string, enum: [original_demo, original, licensed]}
        availability: {type: string, const: available}
        bookId: {type: ['string', 'null']}
        versionId: {type: string}
        title: {type: string}
        publicationState: {$ref: '#/components/schemas/PublicationState'}
        contentReadiness: {$ref: '#/components/schemas/ContentReadiness'}
        releaseReady: {type: boolean}
        usageScope: {type: string, const: local_test_only}
    ContentLicense:
      type: object
      required: [id, sourceType, medium, owner, sourceRef, rightsScope, territory, reviewStatus, proofRef, generator, voice, declaration]
      properties:
        id: {type: string}
        sourceType: {type: string, enum: [original, licensed]}
        medium: {type: string, enum: [text, audio]}
        owner: {type: string}
        sourceRef: {type: string}
        rightsScope: {type: string}
        territory: {type: string}
        reviewStatus: {type: string, enum: [pending_review, confirmed, rejected, expired]}
        proofRef: {type: ['string', 'null']}
        generator: {type: string}
        voice: {type: string}
        declaration: {type: string}
    Sentence:
      type: object
      required: [id, stableKey, sequence, speaker, text, translation, explanation, focus, audioAssetId, startMs, endMs, audio]
      properties:
        id: {type: string}
        stableKey: {type: string}
        identityId: {type: string}
        paragraphId: {type: string}
        sequence: {type: integer, minimum: 1}
        speaker: {type: string}
        text: {type: string}
        translation: {type: string}
        explanation: {type: string}
        focus: {type: string}
        audioAssetId: {type: string}
        startMs: {type: integer, const: 0}
        endMs: {type: integer, minimum: 1}
        audio:
          type: object
          required: [id, licenseId, sourceKind, mimeType, byteSize, durationMs, sha256, status, uri]
          properties:
            id: {type: string}
            licenseId: {type: string}
            sourceKind: {type: string, enum: [original_tts, original_recording, licensed_audio]}
            mimeType: {type: string, const: audio/mpeg}
            byteSize: {type: integer, minimum: 1}
            durationMs: {type: integer, minimum: 1}
            sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
            status: {type: string, const: ready}
            uri: {type: string}
    Problem:
      type: object
      required: [type, title, status, code, detail, instance, traceId, retryable, fieldErrors]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        instance: {type: string}
        traceId: {type: string, format: uuid}
        retryable: {type: boolean}
        fieldErrors: {type: array, items: {type: object}}
